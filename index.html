<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="user-controls">
        <button id="rock">Rock</button>
        <button id="paper">Paper</button>
        <button id="scissors">Scissors</button>
    </div>
    <div class="results">
        <h3>Round results</h3>
        <p class="human-choice-display">Human chose: </p>
        <p class="computer-choice-display">Computer chose: </p>
        <p class="round-result">Round won by: </p>
        <h3>Current scores</h3>
        <p class="human-score-track">Human score: 0</p>
        <p class="computer-score-track">Computer score: 0</p>
    </div>
    <script src="script.js"></script>
</body>

</html>
